name: ci

on:
  push:
  pull_request:
  schedule:
    # Еженедельно — чтобы новые CVE в зависимостях находились без коммита
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Не go-version-file: go.mod — там указана минимальная версия языка,
          # и setup-go ставил бы ровно её. Патчи безопасности стандартной
          # библиотеки выходят в более поздних релизах, поэтому собираем
          # и сканируем на актуальном stable.
          go-version: stable
          check-latest: true
          cache: true

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED="$(gofmt -l ./cmd ./internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:" >&2
            echo "$UNFORMATTED" >&2
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        # Блокирующий: сборка на актуальном Go, поэтому находка здесь означает
        # уязвимость в коде или в зависимостях, а не отставание рантайма.

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
